name: Build Kernel with sukisu(msm8953 - tissot / Mi A1)

on:
  workflow_dispatch:
    inputs:
      release_zip:
        description: "Attach the AnyKernel3 zip as a GitHub Release"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

env:
  DEFCONFIG: tissot_defconfig
  ARCH: arm64
  KERNEL_NAME: tissot-kernel
  CLANG_REPO: https://gitlab.com/LeCmnGend/proton-clang
  CLANG_BRANCH: clang-15
  ANYKERNEL_REPO: https://github.com/zhantech/Anykernel3-tissot.git
  ANYKERNEL_BRANCH: Anykernel3

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 git curl zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler

      - name: Cache Proton Clang 15
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-15-${{ runner.os }}

      - name: Clone Proton Clang 15
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 -b ${{ env.CLANG_BRANCH }} ${{ env.CLANG_REPO }} clang

      - name: Clone AnyKernel3 (tissot)
        run: git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_REPO }} anykernel

      - name: Export build environment
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          {
            echo "KBUILD_BUILD_USER=Medicee"
            echo "KBUILD_BUILD_HOST=github-actions"
            echo "KBUILD_BUILD_TIMESTAMP=$(date -u)"
          } >> "$GITHUB_ENV"

      - name: Integrate KernelSU (v0.9.5, manual hook, non-GKI)
        run: |
          # KernelSU dropped official non-GKI support at v1.0; the last
          # version with non-GKI support is v0.9.5. This populates
          # drivers/kernelsu (symlink to KernelSU/kernel) and only touches
          # drivers/Makefile / drivers/Kconfig if the hookup lines are
          # missing - they're already present in this tree, so it just
          # clones the driver source.
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Apply manual hook patch
        run: |
          # Adds the KSU hook call sites this non-GKI 4.9 tree needs:
          # do_execveat_common (fs/exec.c), faccessat syscall (fs/open.c,
          # pre-4.17 style), vfs_read (fs/read_write.c), vfs_fstatat
          # (fs/stat.c, pre-vfs_statx kernels), and the Safe Mode input
          # hook (drivers/input/input.c). Also flips CONFIG_KSU=y and
          # disables CONFIG_KPROBES/CONFIG_KPROBE_EVENTS in tissot_defconfig,
          # per KernelSU's own non-GKI guide: leaving KPROBES on alongside
          # a manual hook lets volume-down accidentally trigger Safe Mode.
          if ! git apply --check patches/kernelsu-manual-hook.patch 2>patch.rej; then
            echo "::error::Manual hook patch failed to apply cleanly - kernel source has likely drifted from what the patch expects. See patch.rej:"
            cat patch.rej
            exit 1
          fi
          git apply patches/kernelsu-manual-hook.patch

      - name: Generate defconfig
        run: make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

      - name: Build kernel
        run: |
          make -j"$(nproc --all)" O=out ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Verify build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb not found - build failed. See build.log."
            exit 1
          fi

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cd anykernel
          ZIP_NAME="${{ env.KERNEL_NAME }}-${{ github.run_number }}.zip"
          zip -r9 "../${ZIP_NAME}" ./* -x ".git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: ${{ inputs.release_zip == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.KERNEL_NAME }} #${{ github.run_number }}
          files: ${{ env.ZIP_NAME }}
